name: TASE official exclusion registry

on:
  pull_request:
    paths:
      - tase_registry.py
      - tests/test_tase_registry.py
      - docs/tase_registry.md
      - .github/workflows/tase-registry-weekly.yml
      - data/latest/tase_registered_securities.json
  push:
    branches: [main, feature/tase-exclusion-registry-20261123]
    paths:
      - tase_registry.py
      - tests/test_tase_registry.py
      - .github/workflows/tase-registry-weekly.yml
  schedule:
    # Friday 08:17 UTC = 10:17 Israel winter, 11:17 Israel summer.
    # Scheduled updates are prior to Rosario's Saturday/Sunday lead workflows.
    - cron: '17 8 * * 5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tase-registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate registry code without secret or outbound requests
        run: python -m unittest discover -s tests -p 'test_tase_registry.py' -v

  official-pr-smoke:
    # Same-repository PR only. A read-only auth+parser test using the secret;
    # NO raw securities are uploaded or committed to the public repository.
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/feature/tase-exclusion-registry-20261123')
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify official API authorization and full registry build (no public upload)
        env:
          TASE_API_KEY: ${{ secrets.RNEWS_TASE_2026 }}
        run: |
          set -euo pipefail
          if [ -z "$TASE_API_KEY" ]; then
            echo "::error::TASE_API_KEY missing in NEWS repository Secrets / Actions"
            exit 2
          fi
          python tase_registry.py refresh --lookback 28 --output "$RUNNER_TEMP/tase_official_smoke.json"
          python tase_registry.py stats --registry "$RUNNER_TEMP/tase_official_smoke.json"

  official-weekly-refresh:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read ONLY approved TASE DataWise endpoints
        id: official
        continue-on-error: true
        env:
          TASE_API_KEY: ${{ secrets.RNEWS_TASE_2026 }}
        run: python tase_registry.py refresh --lookback 28
      - name: Persist official success or safe failure status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest/tase_registered_securities.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(tase): update official exclusion registry [skip ci]"
            git push
          fi
      - name: Surface error if official source failed
        if: steps.official.outcome != 'success'
        run: |
          echo "::error::Official TASE refresh failed; no new snapshot was fabricated. Check workflow status and TASE_API_KEY."
          exit 1
