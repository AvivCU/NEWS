name: Test public RSS indexed discovery for blocked sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/public-index-rss-probe.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python public_index_rss_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-index-rss-audit
          path: official_index_rss_audit.json
