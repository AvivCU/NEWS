name: Validate official Rail tender REST API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/rail-api-live.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python rail_api_live_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-rail-api-live-report
          path: rail_api_live_report.json

# diagnose robots policy only
