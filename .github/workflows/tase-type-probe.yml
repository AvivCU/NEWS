name: TASE type mapping probe

on:
  push:
    branches: [feature/tase-exclusion-registry-20261123]
    paths: [.github/workflows/tase-type-probe.yml, tools/tase_classification_probe.py]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Summarize security type codes for fixed public issuers
        env:
          TASE_API_KEY: ${{ secrets.RNEWS_TASE_2026 }}
        run: python tools/tase_classification_probe.py
