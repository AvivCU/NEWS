name: RSS state concurrent Git write integrity (isolated)
on:
  push:
    branches:
      - research/rss-state-git-race-20261123
    paths:
      - "rss_state_git_race_test.py"
      - "rss_state_schema_race_test.py"
      - "three_way_rss_state.py"
      - "test_three_way_rss_state.py"
      - "rss_seen_gzip_git_race_test.py"
      - "rss_collect_catchup_gap_test.py"
      - "rss_full_scan_watermark_test.py"
      - ".github/workflows/rss-state-race.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  real-git-race:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run two writers against disposable bare Git repo
        run: |
          python rss_state_git_race_test.py
          python rss_state_schema_race_test.py
          python test_three_way_rss_state.py
          python rss_seen_gzip_git_race_test.py
          python rss_collect_catchup_gap_test.py
          python rss_full_scan_watermark_test.py
