name: TASE auth diagnostic (read-only)

on:
  push:
    branches: [feature/tase-exclusion-registry-20261123]
    paths:
      - .github/workflows/tase-auth-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compare official endpoints with both credentials and no credential
        env:
          TASE_API_KEY: ${{ secrets.TASE_API_KEY }}
          NEWSR: ${{ secrets.NEWSR }}
        run: python tools/tase_auth_diagnostic.py
