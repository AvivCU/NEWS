name: Official sources access audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/official-source-audit.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Probe public source sites
        run: python official_source_audit.py
      - name: Discover government datasets via public CKAN API
        run: python ckan_discovery.py
      - name: Fetch real records from official CKAN datasets
        run: python gov_dataset_reader.py
      - name: Attach results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-source-audit
          path: |
            audit.json
            ckan_discovery.json
            dataset_samples.json
          retention-days: 7

# rerun with refined challenge detection and data.gov.il API probes
