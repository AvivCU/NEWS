name: Daily government procurement update
on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:
    inputs:
      force_download:
        description: 'Re-download both published ZIPs for validation'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - .github/workflows/daily-procurement.yml
permissions:
  contents: write
concurrency:
  group: government-procurement-daily
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install streaming XML parser
        run: python -m pip install lxml==6.0.2
      - name: Test monitor and safe-failure logic
        run: python -m unittest discover -s tests -v
      - name: Check exact government publication links; validate new ZIPs
        env:
          FORCE_DOWNLOAD: ${{ inputs.force_download || 'false' }}
        run: |
          # Sunday UTC: verify content even if government reused the same URL.
          if [ "$FORCE_DOWNLOAD" = "true" ] || { [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$(date -u +%u)" = "7" ]; }; then
            python daily_procurement.py --force-download
          else
            python daily_procurement.py
          fi
      - name: Save confirmed publication version metadata
        if: success()
        run: |
          if [ -f state/procurement_versions.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/procurement_versions.json state/procurement_snapshots/*.json.gz
            if ! git diff --cached --quiet; then
              git commit -m "chore: update government procurement publication versions [skip ci]"
              git push
            fi
          fi
      - name: Annotate NEW procurement events with official TASE status (shadow only)
        # No change to procurement_events.json, procurement state or public artifacts.
        # Read-only classification only. If TASE/API fails, upstream reports remain.
        if: success()
        continue-on-error: true
        timeout-minutes: 4
        env:
          TASE_API_KEY: ${{ secrets.RNEWS_TASE_2026 }}
        run: |
          if [ -z "$TASE_API_KEY" ]; then
            echo "TASE shadow skipped: API credential unavailable"
          else
            python tase_news_integration.py \
              --events procurement_events.json \
              --registry "$RUNNER_TEMP/news_tase_registry.json" \
              --output "$RUNNER_TEMP/news_tase_review.json"
          fi
      - name: Upload public status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: procurement-daily-status
          path: |
            procurement_daily_report.json
            procurement_events.json
          retention-days: 14

