name: Inspect official XLS schema
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/schema-probe.yml
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install xlrd==2.0.2
      - run: python schema_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: government-xls-schema
          path: monthly_schema.json
