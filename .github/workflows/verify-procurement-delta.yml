name: Verify real procurement delta against baseline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-procurement-delta.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install lxml==6.0.2
      - name: Verify full archives against persisted baseline
        run: python daily_procurement.py --force-download
      - name: Assert zero false event alerts for identical official archives
        run: |
          python - <<'PY'
          import json
          x=json.load(open('procurement_events.json',encoding='utf-8'))
          for name,values in x['kinds'].items():
              if values['status']!='compared': raise RuntimeError(f'{name} did not compare against baseline')
              if sum(values['counts'].values()) != 0: raise RuntimeError(f'{name} false event: {values["counts"]}')
              print(f'{name}: {values["new_records"]} rows, {values["new_publications"]} publications, 0 changes')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: procurement-delta-verification
          path: |
            procurement_daily_report.json
            procurement_events.json
